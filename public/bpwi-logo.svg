<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <clipPath id="badge-shape">
      <rect width="400" height="300" rx="36" ry="36" />
    </clipPath>
  </defs>

  <g clip-path="url(#badge-shape)">
    <!-- Top White Sky Area -->
    <rect width="400" height="300" fill="#ffffff" />

    <!-- Wave 1: Sky Cyan (#00B3E3) -->
    <path d="M 0,75 C 15,75 44,42 50,30 C 56,42 85,75 100,75 C 115,75 144,42 150,30 C 156,42 185,75 200,75 C 215,75 244,42 250,30 C 256,42 285,75 300,75 C 315,75 344,42 350,30 C 356,42 385,75 400,75 L 400,300 L 0,300 Z" fill="#00B3E3" />

    <!-- Wave 2: Ocean Blue (#0074C8) -->
    <path d="M 0,140 C 15,140 44,107 50,95 C 56,107 85,140 100,140 C 115,140 144,107 150,95 C 156,107 185,140 200,140 C 215,140 244,107 250,95 C 256,107 285,140 300,140 C 315,140 344,107 350,95 C 356,107 385,140 400,140 L 400,300 L 0,300 Z" fill="#0074C8" />

    <!-- Wave 3: Deep Maritime Navy (#103A71) -->
    <path d="M 0,205 C 15,205 44,172 50,160 C 56,172 85,205 100,205 C 115,205 144,172 150,160 C 156,172 185,205 200,205 C 215,205 244,172 250,160 C 256,172 285,205 300,205 C 315,205 344,172 350,160 C 356,172 385,205 400,205 L 400,300 L 0,300 Z" fill="#103A71" />
  </g>

  <!-- Clean Subtle Perimeter Border -->
  <rect width="400" height="300" rx="36" ry="36" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2" />
</svg>